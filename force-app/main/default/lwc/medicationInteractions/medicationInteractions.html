<template>
    <lightning-card title="Medication Interactions" icon-name="custom:custom93">
        <div class="slds-p-around_medium">
            <lightning-button
                label="Check Interactions"
                onclick={handleCheckInteractions}
                variant="brand"
                disabled={isLoading}>
            </lightning-button>

            <template if:true={isLoading}>
                <div class="slds-p-top_small">
                    <lightning-spinner alternative-text="Loading"></lightning-spinner>
                </div>
            </template>

            <template if:true={error}>
                <div class="slds-p-top_small">
                    <div class="slds-text-color_error">{error}</div>
                </div>
            </template>

            <template if:true={interactions.length}>
                <div class="slds-p-top_small">
                    <lightning-datatable
                        key-field="description"
                        data={interactions}
                        columns={columns}
                        hide-checkbox-column>
                    </lightning-datatable>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
